name: Validate Python
on:
  push:
    branches:
      - feature/unified-midnight-app
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python source
        run: python -m compileall -q .
